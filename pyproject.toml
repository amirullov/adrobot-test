[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adrobot-wrapper"
version = "0.1.0"
description = "A small, safe Keitaro campaign creator and offer-stream editor"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16,<3",
  "mypy>=1.13,<1.19",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --maxfail=1"
cache_dir = "/tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/versions"]
